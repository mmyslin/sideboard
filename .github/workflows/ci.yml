name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the checkout and runs tests — it
# never writes to the repo or uses the token, so drop the default grant.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening) with the
      # human-readable tag in a trailing comment for legibility.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Router unit + integration tests
        run: python3 -m unittest discover -s tests -v

      - name: Router compiles
        run: python3 -m py_compile scripts/sideboard_router.py

      - name: Shell scripts parse (bash -n)
        run: |
          for s in scripts/sideboard-active.sh scripts/sideboard-up.sh install.sh; do
            bash -n "$s"
          done

      - name: Board JS parses
        run: |
          sed -n '/<script>/,/<\/script>/p' roadmap-board.html | sed '1d;$d' > /tmp/board.js
          node --check /tmp/board.js

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            python3 -c "import json,sys; json.load(open('$f')); print('$f OK')"
          done

      - name: Plugin version matches a semver
        run: |
          python3 - <<'PY'
          import json, re
          v = json.load(open(".claude-plugin/plugin.json"))["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", v), f"bad version: {v}"
          print("version", v, "OK")
          PY
