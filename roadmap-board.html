<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roadmap</title>
<style>
  :root {
    color-scheme: light dark;
    /* Warm neutrals to match the Claude Code palette (clay accent, cream/charcoal grays) */
    --bg: #faf9f5;
    --panel: #ffffff;
    --panel-2: #f0eee6;
    --text: #1f1e1d;
    --muted: #73716c;
    --border: #e6e2d8;
    --shadow: 0 1px 2px rgba(60,50,30,.06), 0 1px 3px rgba(60,50,30,.05);
    --accent: #c96442;
    --c-backlog: #2f6fe0;   /* blue */
    --c-progress: #d97706;  /* orange */
    --c-done: #1a9e4b;      /* green */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1e1d;
      --panel: #262624;
      --panel-2: #2d2b28;
      --text: #f0eee6;
      --muted: #9b968d;
      --border: #38352f;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
      --accent: #d97757;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 11.5px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 9px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .switcher { position: relative; display: flex; align-items: center; gap: 9px; }
  .sw-label { color: var(--muted); font-size: 9.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .proj-btn {
    display: inline-flex; align-items: center; gap: 8px; font-family: inherit;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 3px 8px 3px 10px; font-size: 12px; font-weight: 400; line-height: 1.5;
    cursor: pointer; letter-spacing: .01em;
  }
  .proj-btn:hover { background: color-mix(in srgb, var(--panel-2) 82%, var(--text) 10%); }
  .proj-btn .caret { color: var(--muted); flex: none; transition: transform .12s ease; }
  .proj-btn[aria-expanded="true"] .caret { transform: rotate(180deg); }
  .proj-menu {
    position: absolute; top: calc(100% + 5px); left: 0; z-index: 60; min-width: 190px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.28);
    max-height: 62vh; overflow-y: auto;
  }
  .proj-item {
    display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 6px;
    cursor: pointer; font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .proj-item:hover { background: var(--panel-2); color: var(--text); }
  .proj-item .check { flex: none; width: 13px; height: 13px; color: var(--c-backlog); visibility: hidden; }
  .proj-item.sel .check { visibility: visible; }
  .proj-item.sel { font-weight: 500; color: var(--text); }
  .proj-item.auto { border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; margin-bottom: 3px; padding-bottom: 7px; }
  .proj-item .sub { color: var(--muted); font-weight: 400; font-size: 10.5px; margin-left: 2px; }
  header .meta { color: var(--muted); font-size: 9.5px; letter-spacing: .04em; margin-left: auto; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-done); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--c-done) 22%, transparent); }
  .dot.stale { background: var(--c-next); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--c-next) 22%, transparent); }
  .dot.err { background: #dc2626; box-shadow: 0 0 0 2.5px rgba(220,38,38,.22); }
  .board {
    flex: 1;
    display: flex;
    flex-direction: row;
    padding: 6px;
    overflow: hidden;
    min-height: 0;
  }
  .board.stacked { flex-direction: column; }
  /* In Progress typically has 0-1 cards; default it to ~one card tall (header
     19 + padding 10 + card 43 ≈ 76) instead of an equal third of the height.
     Scoped to stacked view; a lane the user has dragged gets .user-sized and
     opts out so drag-to-resize keeps working. */
  .board.stacked .col[data-key="in_progress"]:not(.user-sized) {
    flex: 0 0 auto; min-height: 76px; max-height: 96px;
  }
  .col {
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px;
    overflow: hidden;
  }
  .col-head {
    flex: none;
    display: flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 9.5px;
    text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    padding: 2px 3px 5px;
  }
  .col-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-right: 4px;
  }
  /* Drag handles on the borders between lanes (vertical when side-by-side, horizontal when stacked) */
  .resizer {
    flex: none;
    align-self: stretch;
    position: relative;
    width: 8px;
    cursor: col-resize;
    touch-action: none;
  }
  .resizer::before {
    content: "";
    position: absolute;
    top: 10px; bottom: 10px; left: 50%;
    width: 2px; transform: translateX(-50%);
    background: var(--border);
    border-radius: 2px;
    transition: background .12s ease;
  }
  .resizer:hover::before, .resizer.dragging::before { background: var(--accent); }
  .board.stacked .resizer { width: auto; height: 8px; cursor: row-resize; }
  .board.stacked .resizer::before {
    top: 50%; bottom: auto; left: 10px; right: 10px;
    width: auto; height: 2px; transform: translateY(-50%);
  }
  .col-head .bar { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  .col-head .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* Collapse a whole lane to just its header (#14). Click the header to toggle. */
  .col-head { cursor: pointer; }
  .col-head .chev { color: var(--muted); font-size: 8px; flex: none; transition: transform .12s ease; }
  .col.collapsed .chev { transform: rotate(-90deg); }
  .col.collapsed { flex: 0 0 auto !important; min-height: 0 !important; max-height: none !important; }
  .col.collapsed .col-body { display: none; }
  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 6px;
    box-shadow: var(--shadow);
    animation: fadein .2s ease;
  }
  .card.dragging { opacity: .4; }
  .card-head { line-height: 1.45; }
  .card.has-notes .card-head { cursor: pointer; }
  .card .title { font-weight: 400; font-size: 12.5px; }
  /* hover controls (dummy for now) */
  .card-actions {
    position: absolute; top: 3px; right: 6px;
    display: none; align-items: center; gap: 1px;
    padding: 1px 2px; border-radius: 6px;
    background: var(--panel);
  }
  .card:hover .card-actions { display: flex; }
  .card-actions button {
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; padding: 0;
    border: 0; border-radius: 4px; background: none; cursor: pointer;
    color: var(--muted);
    transition: background .12s ease, color .12s ease;
  }
  .card-actions button:hover { background: var(--panel-2); color: var(--text); }
  .card-actions svg { width: 14px; height: 14px; display: block; }
  .card .notes { display: none; color: var(--muted); margin-top: 3px; font-size: 10.5px; white-space: pre-wrap; }
  .card.open .notes { display: block; }
  .card .ref { color: var(--muted); margin-top: 3px; font-size: 9px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .empty { color: var(--muted); font-size: 10px; font-style: italic; padding: 1px 3px; }
  @keyframes fadein { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  #toast {
    position: fixed; left: 50%; bottom: 10px;
    transform: translateX(-50%) translateY(6px);
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 11px; font-size: 11px;
    box-shadow: var(--shadow); z-index: 10;
    opacity: 0; pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #copy-fallback {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45);
  }
  #copy-fallback .cf-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; width: min(90%, 340px);
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 8px;
  }
  #copy-fallback .cf-msg { font-size: 11.5px; color: var(--text); }
  #copy-fallback textarea {
    width: 100%; height: 92px; resize: none;
    font: 11px/1.4 ui-monospace, Menlo, monospace;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px;
  }
  #copy-fallback .cf-close {
    align-self: flex-end; font-size: 11px; padding: 3px 11px;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--panel-2); color: var(--text); cursor: pointer;
  }
  .col-add {
    margin-left: 6px; width: 15px; height: 15px; padding: 0; flex: none;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 4px;
    background: none; color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1;
  }
  .col-add:hover { color: var(--text); border-color: var(--muted); }
  #card-editor {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45);
  }
  #card-editor .ce-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; width: min(92%, 360px);
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  #card-editor input, #card-editor textarea {
    width: 100%; box-sizing: border-box;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 12px;
  }
  #card-editor textarea { height: 84px; resize: vertical; }
  #card-editor .ce-row { display: flex; justify-content: flex-end; gap: 6px; }
  #card-editor .ce-row button {
    font-size: 11.5px; padding: 4px 12px; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  }
  #card-editor .ce-save { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card .tag {
    display: inline-block; vertical-align: middle; margin-left: 5px;
    font-variant: small-caps; letter-spacing: .03em; font-weight: 600;
    font-size: 10px; line-height: 1.5; padding: 0 6px; border-radius: 8px; white-space: nowrap;
  }
  #card-editor .te-title { font-size: 12px; font-weight: 600; color: var(--text); }
  #card-editor .te-chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 14px; }
  #card-editor .te-chip {
    display: inline-flex; align-items: center; gap: 2px; font-size: 10px;
    padding: 2px 3px 2px 7px; border-radius: 9px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  }
  #card-editor .te-chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px; line-height: 1; padding: 0 2px; }
  #card-editor .te-chip button:hover { color: var(--text); }
  #card-editor .te-empty { font-size: 10px; color: var(--muted); font-style: italic; }
  #card-editor .te-add-row { display: flex; gap: 6px; }
  #card-editor .te-add-row input { flex: 1; }
  #card-editor .te-add {
    font-size: 11.5px; padding: 4px 12px; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
</style>
</head>
<body>
  <header>
    <div class="switcher">
      <span class="sw-label">Project</span>
      <button id="proj-btn" class="proj-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="project">Roadmap</span>
        <svg class="caret" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6.5L8 10l4-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="proj-menu" class="proj-menu" role="menu" hidden></div>
    </div>
    <div class="meta">
      <span id="status">connecting…</span>
      <span class="dot" id="dot"></span>
    </div>
  </header>
  <div class="board" id="board"></div>

<script>
const COLUMNS = [
  { key: "backlog",     label: "Backlog",     color: "var(--c-backlog)"  },
  { key: "in_progress", label: "In Progress", color: "var(--c-progress)" },
  { key: "done",        label: "Done",        color: "var(--c-done)"     },
];
const POLL_MS = 2000;

// Card hover-control icons (inline SVG, self-contained)
const ICON = {
  copy:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  edit:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>',
  tag:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
};

function contrastText(hex) {
  hex = (hex || "808080").replace("#", "");
  const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? "#1a1a1a" : "#fff";
}

// Light versions of the 9-color palette; each tag maps deterministically to one.
const TAG_PALETTE = ["#7cc499", "#6fc7ba", "#7fb4e2", "#8f97e0", "#b18fdc", "#e58bb3", "#f08d8d", "#f2a86a", "#ddb85e"];
function tagColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return TAG_PALETTE[h % TAG_PALETTE.length];
}

let lastRaw = "";
// Manual project pin from the switcher. null = auto-follow the active project.
// Kept in the URL (?project=<id>) so each pane is independent — localStorage is
// shared across same-origin panes and would switch them all together. (#43)
let pinnedId = new URLSearchParams(location.search).get("project") || null;
const expanded = new Set();   // item ids whose description is expanded (persists across re-renders)
const collapsed = new Set();  // lane keys collapsed to just their header (#14; persists across re-renders)
const grow = {};              // per-lane flex-grow, set by dragging resizers (persists across re-renders)

function rel(ts) {
  if (!ts) return "";
  const d = new Date(ts).getTime();
  if (isNaN(d)) return "";
  const s = Math.round((Date.now() - d) / 1000);
  if (s < 5) return "just now";
  if (s < 60) return s + "s ago";
  const m = Math.round(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.round(m / 60);
  if (h < 24) return h + "h ago";
  return Math.round(h / 24) + "d ago";
}
function esc(x) { return (x ?? "").toString().replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }

function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

// Play button: send the card's text to Claude. Uses a host bridge if one is
// injected (window.sendPrompt / window.claude.sendPrompt); otherwise copies to
// the clipboard so it can be pasted into the prompt.
function sendCardToClaude(card) {
  if (!card) return;
  const title = (card.querySelector(".title")?.textContent || "").trim();
  const notes = (card.querySelector(".notes")?.textContent || "").trim();
  if (!title) return;
  // Templated, editable prompt — paste into the Claude prompt, tweak, then send.
  let text = `Let's work on this Sideboard roadmap item: "${title}".`;
  if (notes) text += `\n\nNotes: ${notes}`;
  text += `\n\nMove it to In Progress and start implementing.`;
  const bridge = typeof window.sendPrompt === "function" ? window.sendPrompt
    : (window.claude && typeof window.claude.sendPrompt === "function") ? window.claude.sendPrompt.bind(window.claude)
    : null;
  if (bridge) { bridge(text); toast("Sent to Claude"); return; }
  copyText(text).then((ok) => {
    if (ok) toast("Copied — ⌘V into the prompt to edit & send");
    else showCopyFallback(text);   // clipboard blocked in this pane — let the user copy manually
  });
}

// Last-resort copy: show the text pre-selected so the user can press ⌘C.
// Native selection-copy is always allowed, even where the clipboard APIs are blocked.
function showCopyFallback(text) {
  document.getElementById("copy-fallback")?.remove();
  const m = document.createElement("div");
  m.id = "copy-fallback";
  m.innerHTML = `<div class="cf-box"><div class="cf-msg">Copy blocked here — press ⌘C, then paste into the prompt.</div><textarea readonly></textarea><button type="button" class="cf-close">Close</button></div>`;
  const ta = m.querySelector("textarea");
  ta.value = text;
  const close = () => m.remove();
  m.addEventListener("click", (e) => { if (e.target === m) close(); });
  m.querySelector(".cf-close").addEventListener("click", close);
  document.body.appendChild(m);
  ta.focus(); ta.select();
}

// Create / edit a card -> POST /api/create or /api/edit (github mode).
function openEditor(mode, data) {
  data = data || {};
  document.getElementById("card-editor")?.remove();
  const m = document.createElement("div");
  m.id = "card-editor";
  m.innerHTML = `<div class="ce-box">
      <input class="ce-title" type="text" placeholder="Title" />
      <textarea class="ce-notes" placeholder="Notes (optional)"></textarea>
      <div class="ce-row">
        <button type="button" class="ce-cancel">Cancel</button>
        <button type="button" class="ce-save">${mode === "create" ? "Add" : "Save"}</button>
      </div>
    </div>`;
  const titleEl = m.querySelector(".ce-title");
  const notesEl = m.querySelector(".ce-notes");
  titleEl.value = data.title || "";
  notesEl.value = data.notes || "";
  const close = () => m.remove();
  m.addEventListener("mousedown", (e) => { if (e.target === m) close(); });
  m.querySelector(".ce-cancel").addEventListener("click", close);
  const submit = () => {
    const title = titleEl.value.trim();
    if (!title) { titleEl.focus(); return; }
    const url = mode === "create" ? "/api/create" : "/api/edit";
    const payload = mode === "create"
      ? { title, notes: notesEl.value }
      : { number: data.number, title, notes: notesEl.value };
    close();
    toast(mode === "create" ? "Adding…" : "Saving…");
    fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(r => { if (!r.ok) throw new Error(r.status); })
      .catch(() => toast("Not saved — is the companion running?"));
  };
  m.querySelector(".ce-save").addEventListener("click", submit);
  titleEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
  document.body.appendChild(m);
  titleEl.focus();
}

// Manage a card's tags -> POST /api/label (github mode; tags = GitHub labels).
function openTags(card) {
  const number = Number(card.dataset.ref);
  let tags = [...card.querySelectorAll(".card-head .tag")].map(t => t.textContent);
  document.getElementById("card-editor")?.remove();
  const m = document.createElement("div");
  m.id = "card-editor";
  m.innerHTML = `<div class="ce-box">
      <div class="te-title">Tags</div>
      <div class="te-chips"></div>
      <div class="te-add-row">
        <input class="ce-title" type="text" placeholder="Add a tag…" />
        <button type="button" class="te-add">Add</button>
      </div>
      <div class="ce-row"><button type="button" class="ce-cancel">Done</button></div>
    </div>`;
  const chipsEl = m.querySelector(".te-chips");
  const input = m.querySelector("input");
  const post = (payload) => fetch("/api/label", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ number }, payload)),
  }).then(r => { if (!r.ok) throw new Error(r.status); })
    .catch(() => toast("Tag change not saved — is the companion running?"));
  const renderChips = () => {
    chipsEl.innerHTML = tags.length
      ? tags.map(t => `<span class="te-chip">${esc(t)}<button type="button" data-rm="${esc(t)}" aria-label="Remove">×</button></span>`).join("")
      : `<span class="te-empty">no tags yet</span>`;
  };
  chipsEl.addEventListener("click", (e) => {
    const rm = e.target.getAttribute && e.target.getAttribute("data-rm");
    if (!rm) return;
    tags = tags.filter(t => t !== rm); renderChips(); post({ remove: rm });
  });
  const add = () => {
    const name = input.value.trim();
    input.value = "";
    if (!name || tags.includes(name)) return;
    tags.push(name); renderChips(); post({ add: name });
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });
  m.querySelector(".te-add").addEventListener("click", add);
  m.querySelector(".ce-cancel").addEventListener("click", () => { add(); m.remove(); });  // commit pending input on Done
  m.addEventListener("mousedown", (e) => { if (e.target === m) m.remove(); });
  renderChips();
  document.body.appendChild(m);
  input.focus();
}

// Copy that works inside embedded panes. The async Clipboard API rejects with
// "Document is not focused" there, so try the in-gesture execCommand path first
// (copies the current selection during a real click) and fall back to the async API.
function copyText(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;";
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (ok) return Promise.resolve(true);
  } catch (_) { /* fall through to async API */ }
  if (navigator.clipboard?.writeText) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => false);
  }
  return Promise.resolve(false);
}

function render(data) {
  document.getElementById("project").textContent = data.project || "Roadmap";
  document.title = "Roadmap";   // fixed title — project can change under a single pane (#37 reverted)
  const board = document.getElementById("board");
  const items = Array.isArray(data.items) ? data.items : [];
  // snapshot scroll (each lane scrolls independently, plus the page) so a
  // re-render restores position instead of jumping to the top (#42)
  const prevScroll = {};
  board.querySelectorAll(".col").forEach(c => {
    const b = c.querySelector(".col-body");
    if (b) prevScroll[c.dataset.key] = b.scrollTop;
  });
  const prevWinY = window.scrollY;
  board.innerHTML = "";
  const KNOWN = new Set(COLUMNS.map(c => c.key));
  COLUMNS.forEach((col, idx) => {
    const inCol = items.filter(i => {
      const s = i.status || "backlog";
      // fold any unrecognized status into Backlog so a card never silently disappears
      return s === col.key || (col.key === "backlog" && !KNOWN.has(s));
    });
    if (idx > 0) {
      const rez = document.createElement("div");
      rez.className = "resizer";
      rez.dataset.prev = COLUMNS[idx - 1].key;
      rez.dataset.next = col.key;
      board.appendChild(rez);
    }
    const el = document.createElement("div");
    el.className = "col";
    el.dataset.key = col.key;
    // In Progress usually holds 0-1 cards, so don't let it claim an equal
    // share of height by default — let CSS size it to ~one card (stacked view).
    // Any lane the user has dragged carries an explicit grow -> honor it as-is.
    if (collapsed.has(col.key)) { el.classList.add("collapsed"); el.style.flexGrow = "0"; }   // #14
    else if (grow[col.key] != null) { el.style.flexGrow = grow[col.key]; el.classList.add("user-sized"); }
    else if (col.key !== "in_progress") { el.style.flexGrow = 1; }
    const add = col.key === "backlog" ? `<button class="col-add" type="button" title="Add item" aria-label="Add item">+</button>` : "";
    el.innerHTML = `<div class="col-head"><span class="chev">▾</span><span class="bar" style="background:${col.color}"></span>${col.label}<span class="count">${inCol.length}</span>${add}</div><div class="col-body"></div>`;
    const body = el.querySelector(".col-body");
    if (inCol.length === 0) {
      body.insertAdjacentHTML("beforeend", `<div class="empty">—</div>`);
    }
    for (const it of inCol) {
      const hasNotes = !!it.notes;
      const id = it.id != null ? String(it.id) : "";
      const isOpen = hasNotes && expanded.has(id);
      const cls = ["card", hasNotes && "has-notes", isOpen && "open"].filter(Boolean).join(" ");
      body.insertAdjacentHTML("beforeend", `
        <div class="${cls}" data-id="${esc(id)}" data-ref="${esc(it.ref)}" draggable="true">
          <div class="card-actions">
            <button type="button" data-action="copy" title="Copy a prompt to send to Claude" aria-label="Copy a prompt to send to Claude">${ICON.copy}</button>
            <button type="button" data-action="edit" title="Edit card" aria-label="Edit card">${ICON.edit}</button>
            <button type="button" data-action="expand" title="Expand card" aria-label="Expand card">${ICON.expand}</button>
            <button type="button" data-action="tag" title="Tags" aria-label="Tags">${ICON.tag}</button>
          </div>
          <div class="card-head">
            <span class="title">${esc(it.title)}</span>${(it.labels || []).map(l => {
              const c = l.colorIndex != null ? TAG_PALETTE[l.colorIndex % TAG_PALETTE.length] : tagColor(l.name);
              return `<span class="tag" style="background:${c};color:${contrastText(c)}">${esc(l.name)}</span>`;
            }).join("")}
          </div>
          ${hasNotes ? `<div class="notes">${esc(it.notes)}</div>` : ""}
          ${it.ref != null ? `<div class="ref"${it.updated_at ? ` title="updated ${rel(it.updated_at)}"` : ""}>#${esc(it.ref)}</div>` : ""}
        </div>`);
    }
    board.appendChild(el);
  });
  // restore the scroll positions captured before the rebuild (#42)
  board.querySelectorAll(".col").forEach(c => {
    const b = c.querySelector(".col-body");
    if (b && prevScroll[c.dataset.key] != null) b.scrollTop = prevScroll[c.dataset.key];
  });
  window.scrollTo(0, prevWinY);
}

function setStatus(state, data) {
  const dot = document.getElementById("dot");
  const status = document.getElementById("status");
  dot.className = "dot" + (state === "err" ? " err" : state === "stale" ? " stale" : "");
  if (state === "err") { status.textContent = (data && data.error) || "can't reach the board server…"; return; }
  const up = data && data.updated_at ? "updated " + rel(data.updated_at) : "live";
  status.textContent = up;
}

async function poll() {
  try {
    const pinQ = pinnedId ? "&project=" + encodeURIComponent(pinnedId) : "";
    const res = await fetch("roadmap.json?_=" + Date.now() + pinQ, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const raw = await res.text();
    const data = JSON.parse(raw);
    if (window.__BV && data.board_version && data.board_version !== window.__BV) {
      location.replace(location.pathname + "?_bv=" + data.board_version + pinQ); return;   // stale HTML -> reload fresh, keep the pin
    }
    // re-render only when the CONTENT changes — ignore updated_at, which the
    // router re-stamps every sync (~45s) and would otherwise force a needless
    // re-render (and scroll jump) even when nothing changed (#42)
    const sig = JSON.stringify({ p: data.project, m: data.mode, items: data.items, e: data.error });
    if (sig !== lastRaw) { lastRaw = sig; render(data); }
    if (data.error) { setStatus("err", data); return; }
    const age = data.updated_at ? Date.now() - new Date(data.updated_at).getTime() : 0;
    setStatus(age > 3600000 ? "stale" : "ok", data);
  } catch (e) {
    setStatus("err");
  }
}
// Toggle a card's description open/closed; state survives re-renders.
function toggleExpand(card) {
  if (!card) return;
  const id = card.dataset.id;
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  card.classList.toggle("open");
}

// Collapse/expand a whole lane to just its header; state survives re-renders (#14).
function toggleCollapse(col) {
  if (!col) return;
  const key = col.dataset.key;
  const nowCollapsed = !collapsed.has(key);
  if (nowCollapsed) collapsed.add(key); else collapsed.delete(key);
  col.classList.toggle("collapsed", nowCollapsed);
  col.style.flexGrow = nowCollapsed ? "0"
    : (grow[key] != null ? grow[key] : (key === "in_progress" ? "" : 1));
}

// Click a card (or its expand button) to toggle its description.
document.getElementById("board").addEventListener("click", (e) => {
  if (e.target.closest(".col-add")) { openEditor("create"); return; }
  const head = e.target.closest(".col-head");
  if (head) { toggleCollapse(head.parentElement); return; }   // #14: click header to collapse/expand
  const actionBtn = e.target.closest(".card-actions button");
  if (actionBtn) {
    e.stopPropagation();
    const card = actionBtn.closest(".card");
    if (actionBtn.dataset.action === "copy") sendCardToClaude(card);
    else if (actionBtn.dataset.action === "expand") toggleExpand(card);
    else if (actionBtn.dataset.action === "edit") openEditor("edit", {
      number: Number(card.dataset.ref),
      title: card.querySelector(".title").textContent,
      notes: (card.querySelector(".notes") || {}).textContent || "",
    });
    else if (actionBtn.dataset.action === "tag") openTags(card);
    return;
  }
  toggleExpand(e.target.closest(".card.has-notes"));
});

// Stack lanes vertically when the board is too narrow for readable side-by-side columns.
(function autoStack() {
  const board = document.getElementById("board");
  const STACK_BELOW = 740;   // ~175px per column across 4 columns + handles
  const apply = () => board.classList.toggle("stacked", board.clientWidth < STACK_BELOW);
  apply();
  if (window.ResizeObserver) new ResizeObserver(apply).observe(board);
  window.addEventListener("resize", apply);   // fallback for environments where RO doesn't fire
  setInterval(apply, 1000);                   // final safety net for embedded panes
})();

// Drag a resizer to reallocate space between its two neighbouring lanes.
(function enableResize() {
  const board = document.getElementById("board");
  let drag = null;
  board.addEventListener("pointerdown", (e) => {
    const rez = e.target.closest(".resizer");
    if (!rez) return;
    const prev = board.querySelector(`.col[data-key="${rez.dataset.prev}"]`);
    const next = board.querySelector(`.col[data-key="${rez.dataset.next}"]`);
    if (!prev || !next) return;
    const stacked = board.classList.contains("stacked");
    const gPrev = parseFloat(prev.style.flexGrow) || 1;
    const gNext = parseFloat(next.style.flexGrow) || 1;
    drag = {
      rez, prev, next, stacked,
      start: stacked ? e.clientY : e.clientX,
      combinedPx: (stacked ? prev.offsetHeight + next.offsetHeight : prev.offsetWidth + next.offsetWidth),
      combinedGrow: gPrev + gNext,
      gPrev, prevKey: rez.dataset.prev, nextKey: rez.dataset.next,
    };
    rez.classList.add("dragging");
    document.body.style.userSelect = "none";
    try { rez.setPointerCapture(e.pointerId); } catch {}
    e.preventDefault();
  });
  board.addEventListener("pointermove", (e) => {
    if (!drag || !drag.combinedPx) return;
    const pos = drag.stacked ? e.clientY : e.clientX;
    const frac = (pos - drag.start) / drag.combinedPx;
    const min = drag.combinedGrow * 0.1;
    let gPrev = Math.max(min, Math.min(drag.combinedGrow - min, drag.gPrev + frac * drag.combinedGrow));
    const gNext = drag.combinedGrow - gPrev;
    grow[drag.prevKey] = gPrev; grow[drag.nextKey] = gNext;
    drag.prev.style.flexGrow = gPrev; drag.next.style.flexGrow = gNext;
  });
  const end = (e) => {
    if (!drag) return;
    drag.rez.classList.remove("dragging");
    document.body.style.userSelect = "";
    try { drag.rez.releasePointerCapture(e.pointerId); } catch {}
    drag = null;
  };
  board.addEventListener("pointerup", end);
  board.addEventListener("pointercancel", end);
})();

// Drag & drop: move between columns / reorder -> POST /api/drop (github mode; needs the companion).
(function enableDnD() {
  const board = document.getElementById("board");
  let dragEl = null;

  const dragAfter = (bodyEl, y) => {
    for (const c of bodyEl.querySelectorAll(".card:not(.dragging)")) {
      const r = c.getBoundingClientRect();
      if (y < r.top + r.height / 2) return c;
    }
    return null;
  };

  board.addEventListener("dragstart", (e) => {
    const card = e.target.closest(".card");
    if (!card || e.target.closest(".card-actions")) { e.preventDefault(); return; }
    dragEl = card;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", card.dataset.ref); } catch (_) {}
  });

  board.addEventListener("dragover", (e) => {
    if (!dragEl) return;
    const bodyEl = e.target.closest(".col-body");
    if (!bodyEl) return;
    e.preventDefault();
    const after = dragAfter(bodyEl, e.clientY);
    if (after == null) bodyEl.appendChild(dragEl);
    else bodyEl.insertBefore(dragEl, after);
  });

  board.addEventListener("dragend", () => {
    if (!dragEl) return;
    const card = dragEl; dragEl = null;
    card.classList.remove("dragging");
    const status = card.closest(".col") && card.closest(".col").dataset.key;
    if (!status) return;
    const number = Number(card.dataset.ref);
    const order = [...board.querySelectorAll(".card")].map(c => Number(c.dataset.ref));
    fetch("/api/drop", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ number, status, order }),
    }).then(r => { if (!r.ok) throw new Error(r.status); })
      .catch(() => toast("Move not saved — is the companion running?"));
  });
})();

// ---- project switcher dropdown (#43): instant, client-side, no model ----------
(function switcher() {
  const btn = document.getElementById("proj-btn");
  const menu = document.getElementById("proj-menu");
  if (!btn || !menu) return;
  const CHECK = '<svg class="check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.4l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let projects = [];

  function draw() {
    const rows = [`<div class="proj-item auto${pinnedId ? "" : " sel"}" data-id="">${CHECK}<span>Auto <span class="sub">follow active</span></span></div>`];
    for (const p of projects) {
      rows.push(`<div class="proj-item${pinnedId === p.id ? " sel" : ""}" data-id="${esc(p.id)}">${CHECK}<span>${esc(p.name)}</span></div>`);
    }
    menu.innerHTML = rows.join("");
  }
  async function open() {
    try { projects = ((await (await fetch("projects?_=" + Date.now(), { cache: "no-store" })).json()).projects) || []; }
    catch { projects = []; }
    draw();
    menu.hidden = false; btn.setAttribute("aria-expanded", "true");
  }
  function close() { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); }

  btn.addEventListener("click", e => { e.stopPropagation(); menu.hidden ? open() : close(); });
  menu.addEventListener("click", e => {
    const item = e.target.closest(".proj-item"); if (!item) return;
    pinnedId = item.dataset.id || null;
    const u = new URL(location.href);
    pinnedId ? u.searchParams.set("project", pinnedId) : u.searchParams.delete("project");
    history.replaceState(null, "", u);            // per-pane, survives reloads
    close(); lastRaw = ""; poll();                // instant switch — re-fetch + re-render
  });
  document.addEventListener("click", () => { if (!menu.hidden) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
})();

poll();
setInterval(poll, POLL_MS);
</script>
